name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run kit:staleness
      - if: github.event_name == 'pull_request'
        run: npm run release:guard -- --base "${{ github.event.pull_request.base.sha }}"
      - run: npm pack --dry-run
