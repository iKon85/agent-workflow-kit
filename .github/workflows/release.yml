name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated version tag to reconcile
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14
          registry-url: 'https://registry.npmjs.org'
      - name: Validate release intent
        id: intent
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          release_tag="$RELEASE_TAG"
          if [[ ! "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "release intent must be an explicit v<SemVer> tag" >&2
            exit 1
          fi

          git fetch --force --tags origin
          git fetch --force --no-tags origin main:refs/remotes/origin/main

          if ! git show-ref --verify --quiet "refs/tags/$release_tag"; then
            echo "release tag $release_tag does not exist" >&2
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/$release_tag")" != "tag" ]; then
            echo "release tag $release_tag must be annotated" >&2
            exit 1
          fi

          tag_commit="$(git rev-list -n 1 "refs/tags/$release_tag")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "release tag $release_tag is not an ancestor of origin/main" >&2
            exit 1
          fi
          if [ "$tag_commit" != "$(git rev-parse origin/main)" ]; then
            echo "release tag $release_tag does not identify the current origin/main commit" >&2
            exit 1
          fi

          git checkout --detach "$tag_commit"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$release_tag" != "v$package_version" ]; then
            echo "release tag $release_tag does not match package version v$package_version" >&2
            exit 1
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"
      - name: Use Trusted-Publishing-capable npm
        run: npm install --global npm@11.5.1
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run kit:staleness
      - name: Publish npm, verify readback, then create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ steps.intent.outputs.commit }}
        # Retry/backoff and attempt logging live in the tested release-state
        # reconciler. On the next tagged release, manually verify that Actions
        # shows its bounded `attempt N/M` readback progress.
        run: node scripts/release-state.mjs
